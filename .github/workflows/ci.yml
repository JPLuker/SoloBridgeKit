name: Check and package
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned PDF parser
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check source and syntax
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Build distributable PWA
        run: npm run build
      - name: Audit build output
        run: npm run audit:dist
      - name: Headless Chrome smoke test
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run browser:smoke
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SoloBridgeKit-0.19.1-BROWSER-CAPTURES
          path: test-output/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload UNTESTED preview
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: SoloBridgeKit-0.19.1-UNTESTED
          path: dist/
          if-no-files-found: error
          retention-days: 14
