name: Check and package
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit production dependency advisories
        run: npm audit --omit=dev --audit-level=high --no-fund
      - name: Check source and syntax
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Build distributable PWA
        run: npm run build
      - name: Audit build output
        run: npm run audit:dist
      - name: Headless Chrome smoke test
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run browser:smoke
      - name: Audit M8 release provenance
        run: npm run audit:release
      - name: Verify M8 build checksum manifest
        run: node scripts/verify-release-provenance.mjs test-output/SoloBridgeKit-0.29.0-UNTESTED-provenance.json dist
      - name: M7 keyboard and layout checks
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run browser:a11y
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SoloBridgeKit-0.29.0-BROWSER-CAPTURES
          path: test-output/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload UNTESTED build provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SoloBridgeKit-0.29.0-UNTESTED-PROVENANCE
          path: test-output/*-UNTESTED-provenance.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload UNTESTED preview
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: SoloBridgeKit-0.29.0-UNTESTED
          path: dist/
          if-no-files-found: error
          retention-days: 14
